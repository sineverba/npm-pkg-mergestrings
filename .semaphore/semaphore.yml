version: v1.0

name: Build and test
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2404

global_job_config:
  env_vars:
    - name: SONARSCANNER_VERSION
      value: 12.1.0.3233_8.0.1
  secrets:
    - name: ACCESS_TOKENS

blocks:
  - name: Install dependencies
    skip:
      when: "tag =~ '.*'"
    task:
      jobs:
        - name: Install
          commands:
            - checkout
            - cache restore
            - nvm install
            - nvm use
            - npm ci
            - cache store

  - name: Test
    skip:
      when: "tag =~ '.*'"
    task:
      prologue:
        commands:
          - checkout
          - cache restore
          - nvm install
          - nvm use
      jobs:
        - name: Test
          commands:
            - npm run test
        - name: Prettier
          commands:
            - npm run prettier
        - name: Lint
          commands:
            - npm run lint

  - name: Coverage
    skip:
      when: "tag =~ '.*'"
    task:
      prologue:
        commands:
          - checkout
          - cache restore
          - nvm install
          - nvm use
      jobs:
        - name: Coverage
          commands:
            - npm run coverage

  - name: Reports
    skip:
      when: "tag =~ '.*'"
    task:
      prologue:
        commands:
          - checkout
          - cache restore
          - nvm install
          - nvm use
      jobs:
        - name: Coveralls
          commands:
            - npm run coverage
            - curl -sLO https://coveralls.io/coveralls-linux.tar.gz
            - tar -xzf coveralls-linux.tar.gz
            - export COVERALLS_REPO_TOKEN=$COVERALLS_NPM_PKG_MERGESTRINGS
            - ./coveralls report coverage/lcov.info
        - name: Sonarcloud
          commands:
            - npm run coverage
            - >-
              docker run
              --rm
              -e SONAR_HOST_URL="https://sonarcloud.io"
              -e SONAR_TOKEN=$SONAR_TOKEN
              -v $PWD:/usr/src
              sonarsource/sonar-scanner-cli:$SONARSCANNER_VERSION

promotions:
  - name: Deploy
    pipeline_file: build-deploy.yml
    auto_promote:
      when: "result = 'passed' and tag =~ '.*'"

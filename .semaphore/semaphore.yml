version: v1.0

name: Build and test
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2404

global_job_config:
  env_vars:
    - name: SONARSCANNER_VERSION
      value: 12.1.0.3233
  secrets:
    - name: ACCESS_TOKENS

blocks:
  - name: Install dependencies
    skip:
      when: "tag =~ '.*'"
    task:
      jobs:
        - name: Install
          commands:
            - checkout
            - cache restore
            - nvm install
            - nvm use
            - npm ci
            - cache store

  - name: Test
    skip:
      when: "tag =~ '.*'"
    task:
      prologue:
        commands:
          - checkout
          - cache restore
          - nvm install
          - nvm use
      jobs:
        - name: Test
          commands:
            - npm run test
        - name: Prettier
          commands:
            - npm run prettier
        - name: Lint
          commands:
            - npm run lint

  - name: Coverage
    skip:
      when: "tag =~ '.*'"
    task:
      prologue:
        commands:
          - checkout
          - cache restore
          - nvm install
          - nvm use
      jobs:
        - name: Coverage
          commands:
            - npm run coverage

  - name: Reports
    skip:
      when: "tag =~ '.*'"
    task:
      prologue:
        commands:
          - checkout
          - cache restore
          - nvm install
          - nvm use
      jobs:
        - name: Coveralls
          commands:
            - npm run coverage
            - curl -sLO https://coveralls.io/coveralls-linux.tar.gz
            - tar -xzf coveralls-linux.tar.gz
            - export COVERALLS_REPO_TOKEN=$COVERALLS_NPM_PKG_MERGESTRINGS
            - ./coveralls report coverage/lcov.info
        - name: Sonarcloud
          commands:
            - npm run coverage
            - cache restore sonar-scanner-$SONARSCANNER_VERSION
            - >-
              test -f sonar-scanner-$SONARSCANNER_VERSION/bin/sonar-scanner ||
              (curl -sLO https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-$SONARSCANNER_VERSION.zip &&
              unzip -q sonar-scanner-cli-$SONARSCANNER_VERSION.zip &&
              cache store sonar-scanner-$SONARSCANNER_VERSION sonar-scanner-$SONARSCANNER_VERSION)
            - >-
              ./sonar-scanner-$SONARSCANNER_VERSION/bin/sonar-scanner
              -Dsonar.host.url=https://sonarcloud.io
              -Dsonar.token=$SONAR_TOKEN

promotions:
  - name: Deploy
    pipeline_file: build-deploy.yml
    auto_promote:
      when: "result = 'passed' and tag =~ '.*'"
